<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能助手 - Live Streaming Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                'Microsoft YaHei', sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 登录遮罩 ===== */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 15, 35, 0.97);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .login-box {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 20px;
            padding: 40px;
            width: 360px;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 22px;
        }

        .login-box p {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .login-tab {
            display: flex;
            margin-bottom: 20px;
            background: #0f0f23;
            border-radius: 8px;
            padding: 4px;
        }

        .login-tab button {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.2s;
        }

        .login-tab button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .login-field {
            margin-bottom: 16px;
        }

        .login-field label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }

        .login-field input {
            width: 100%;
            padding: 10px 14px;
            background: #0f0f23;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }

        .login-field input:focus {
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin-top: 4px;
            transition: opacity 0.2s;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-err {
            color: #ef4444;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
        }

        .login-skip {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: #555;
            cursor: pointer;
        }

        .login-skip:hover {
            color: #888;
        }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 1px solid #2a2a4a;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mode-switch {
            display: flex;
            background: #0f0f23;
            border-radius: 8px;
            border: 1px solid #2a2a4a;
            overflow: hidden;
        }

        .mode-btn {
            padding: 5px 12px;
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            background: #0f0f23;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            font-size: 12px;
            color: #aaa;
            cursor: pointer;
        }

        .user-info:hover {
            border-color: #667eea;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 6px #4ade80;
        }

        .status-text {
            font-size: 11px;
            color: #888;
        }

        /* ===== 主体布局 ===== */
        .main-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ===== 侧边栏（会话列表）===== */
        .sidebar {
            width: 220px;
            background: #12122a;
            border-right: 1px solid #2a2a4a;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 14px;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header span {
            font-size: 12px;
            color: #888;
        }

        .new-conv-btn {
            padding: 4px 10px;
            border: 1px solid #667eea;
            border-radius: 6px;
            background: transparent;
            color: #667eea;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .new-conv-btn:hover {
            background: rgba(102, 126, 234, 0.15);
        }

        .conv-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }

        .conv-item {
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 2px;
            transition: background 0.15s;
            border: 1px solid transparent;
        }

        .conv-item:hover {
            background: #1a1a3a;
        }

        .conv-item.active {
            background: rgba(102, 126, 234, 0.15);
            border-color: #667eea55;
        }

        .conv-item-title {
            font-size: 12px;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv-item-time {
            font-size: 10px;
            color: #555;
            margin-top: 2px;
        }

        .conv-item-mode {
            display: inline-block;
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 3px;
            margin-top: 3px;
        }

        .conv-item-mode.chat {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
        }

        .conv-item-mode.rag {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }

        /* ===== 聊天区域 ===== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 0;
            scroll-behavior: smooth;
        }

        .chat-inner {
            max-width: 760px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .welcome {
            text-align: center;
            padding: 50px 20px;
        }

        .welcome-icon {
            font-size: 44px;
            margin-bottom: 14px;
        }

        .welcome h2 {
            font-size: 22px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome p {
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .quick-btn {
            padding: 7px 14px;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 18px;
            color: #aaa;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            border-color: #667eea;
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .message.assistant .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .message.user .avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .bubble {
            max-width: 72%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.65;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user .bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 3px;
        }

        .message.assistant .bubble {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            color: #e0e0e0;
            border-bottom-left-radius: 3px;
        }

        .rag-badge {
            display: inline-block;
            font-size: 10px;
            padding: 1px 6px;
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            border-radius: 4px;
            margin-bottom: 5px;
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 15px;
            background: #667eea;
            margin-left: 2px;
            animation: blink 0.8s infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }

        .loading-dots {
            display: flex;
            gap: 4px;
            padding: 3px 0;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #667eea;
            animation: dotPulse 1.4s infinite;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotPulse {

            0%,
            80%,
            100% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            40% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ===== 输入区 ===== */
        .input-area {
            background: linear-gradient(180deg, transparent 0%, #0f0f23 20%);
            padding: 12px 16px 18px;
            flex-shrink: 0;
        }

        .input-inner {
            max-width: 760px;
            margin: 0 auto;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 14px;
            display: flex;
            align-items: flex-end;
            padding: 4px;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.15);
        }

        #userInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e0e0e0;
            font-size: 14px;
            padding: 9px 10px;
            resize: none;
            max-height: 110px;
            min-height: 20px;
            font-family: inherit;
            line-height: 1.5;
        }

        #userInput::placeholder {
            color: #555;
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 3px 12px rgba(102, 126, 234, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .conv-hint {
            font-size: 11px;
            color: #555;
            margin-top: 6px;
            text-align: center;
        }

        .conv-hint span {
            color: #667eea;
        }

        .footer-info {
            text-align: center;
            padding: 6px;
            font-size: 10px;
            color: #444;
        }

        .chat-container::-webkit-scrollbar {
            width: 5px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 3px;
        }

        .conv-list::-webkit-scrollbar {
            width: 4px;
        }

        .conv-list::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 2px;
        }

        @media (max-width: 600px) {
            .sidebar {
                display: none;
            }

            .bubble {
                max-width: 85%;
            }
        }
    </style>
</head>

<body>

    <!-- 登录遮罩 -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>🤖 AI 智能助手</h2>
            <p>基于自研主从 Reactor 网络框架</p>
            <div class="login-tab">
                <button class="active" id="tabLogin" onclick="switchTab('login')">登录</button>
                <button id="tabReg" onclick="switchTab('register')">注册</button>
            </div>
            <div class="login-field">
                <label>用户名</label>
                <input type="text" id="inputUsername" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="login-field">
                <label>密码</label>
                <input type="password" id="inputPassword" placeholder="请输入密码（至少6位）" autocomplete="current-password">
            </div>
            <button class="login-btn" id="loginBtn" onclick="doLoginOrRegister()">登录</button>
            <div class="login-err" id="loginErr"></div>
            <div class="login-skip" onclick="skipLogin()">暂不登录，匿名使用（无多轮记忆）</div>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="logo">🤖</div>
            <h1>AI 智能助手</h1>
        </div>
        <div class="header-right">
            <div class="mode-switch">
                <button class="mode-btn active" id="btnStream" onclick="setMode('stream')">💬 流式</button>
                <button class="mode-btn" id="btnRag" onclick="setMode('rag')">🔍 知识库</button>
            </div>
            <div class="user-info" id="userInfo" onclick="logout()" style="display:none">
                <span id="userInfoText">未登录</span>
                <span style="color:#555">退出</span>
            </div>
            <div style="display:flex;align-items:center;gap:5px;">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-text" id="statusText">检测中...</span>
            </div>
        </div>
    </div>

    <!-- 主体 -->
    <div class="main-layout">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span>我的会话</span>
                <button class="new-conv-btn" onclick="newConversation()">+ 新建</button>
            </div>
            <div class="conv-list" id="convList">
                <div style="text-align:center;color:#555;font-size:12px;padding:20px;">
                    登录后查看会话历史
                </div>
            </div>
        </div>

        <!-- 聊天区 -->
        <div class="chat-area">
            <div class="chat-container" id="chatContainer">
                <div class="chat-inner" id="chatInner">
                    <div class="welcome" id="welcome">
                        <div class="welcome-icon">✨</div>
                        <h2>你好，我是 AI 助手</h2>
                        <p>登录后支持多轮对话记忆 · 知识库增强问答</p>
                        <div class="quick-actions">
                            <button class="quick-btn" onclick="quickSend('用一句话解释什么是多态')">💡 解释多态</button>
                            <button class="quick-btn" onclick="quickSend('C++ 智能指针有哪几种？')">📚 智能指针</button>
                            <button class="quick-btn" onclick="quickSend('什么是主从 Reactor 模型？')">🔧 Reactor 模型</button>
                            <button class="quick-btn" onclick="quickSend('写一个快速排序的 C++ 代码')">💻 快速排序</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 输入区 -->
            <div class="input-area">
                <div class="input-inner">
                    <div class="input-row">
                        <div class="input-wrapper">
                            <textarea id="userInput" placeholder="输入问题... (Enter 发送，Shift+Enter 换行)" rows="1"
                                onkeydown="handleKeyDown(event)"></textarea>
                        </div>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
                    </div>
                    <div class="conv-hint" id="convHint" style="display:none">
                        当前会话 <span id="convIdDisplay"></span>
                        <span style="cursor:pointer;color:#555;margin-left:8px;" onclick="clearConversation()">×
                            新建对话</span>
                    </div>
                </div>
                <div class="footer-info">
                    tmms 自研网络库 · 多 IO 线程 · SSE 流式 · RAG 知识库 · doubao-seed-1-8
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://' + window.location.hostname + ':8080';

        // ===== 状态 =====
        let mode = 'stream';
        let isGenerating = false;
        let token = localStorage.getItem('ai_token') || '';
        let username = localStorage.getItem('ai_username') || '';
        let currentConvId = 0;
        let loginMode = 'login'; // 'login' | 'register'

        // ===== 初始化 =====
        window.onload = () => {
            if (token) {
                hideLoginOverlay();
                showUserInfo();
                loadConversations();
            }
            checkStatus();
            setInterval(() => { if (!isGenerating) checkStatus(); }, 30000);
        };

        // ===== 登录/注册 =====
        function switchTab(tab) {
            loginMode = tab;
            document.getElementById('tabLogin').className = tab === 'login' ? 'active' : '';
            document.getElementById('tabReg').className = tab === 'register' ? 'active' : '';
            document.getElementById('loginBtn').textContent = tab === 'login' ? '登录' : '注册';
            document.getElementById('loginErr').textContent = '';
        }

        async function doLoginOrRegister() {
            const u = document.getElementById('inputUsername').value.trim();
            const p = document.getElementById('inputPassword').value.trim();
            const errEl = document.getElementById('loginErr');
            errEl.textContent = '';

            if (!u || !p) { errEl.textContent = '请填写用户名和密码'; return; }
            if (p.length < 6) { errEl.textContent = '密码至少 6 位'; return; }

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = loginMode === 'login' ? '登录中...' : '注册中...';

            try {
                const path = loginMode === 'login' ? '/user/login' : '/user/register';
                const resp = await fetch(API_BASE + path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await resp.json();

                if (loginMode === 'register') {
                    if (data.code === 0) {
                        errEl.style.color = '#4ade80';
                        errEl.textContent = '注册成功！请登录';
                        switchTab('login');
                    } else {
                        errEl.style.color = '#ef4444';
                        errEl.textContent = data.message || '注册失败';
                    }
                } else {
                    if (data.code === 0 && data.token) {
                        token = data.token;
                        username = data.username;
                        localStorage.setItem('ai_token', token);
                        localStorage.setItem('ai_username', username);
                        hideLoginOverlay();
                        showUserInfo();
                        loadConversations();
                    } else {
                        errEl.style.color = '#ef4444';
                        errEl.textContent = data.message || '用户名或密码错误';
                    }
                }
            } catch (e) {
                errEl.style.color = '#ef4444';
                errEl.textContent = '网络错误：' + e.message;
            } finally {
                btn.disabled = false;
                btn.textContent = loginMode === 'login' ? '登录' : '注册';
            }
        }

        function skipLogin() {
            token = '';
            username = '';
            hideLoginOverlay();
        }

        function hideLoginOverlay() {
            document.getElementById('loginOverlay').style.display = 'none';
        }

        function showUserInfo() {
            const el = document.getElementById('userInfo');
            el.style.display = 'flex';
            document.getElementById('userInfoText').textContent = '👤 ' + (username || '已登录');
        }

        function logout() {
            if (!confirm('确认退出登录？')) return;
            token = ''; username = '';
            localStorage.removeItem('ai_token');
            localStorage.removeItem('ai_username');
            currentConvId = 0;
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('convList').innerHTML =
                '<div style="text-align:center;color:#555;font-size:12px;padding:20px;">登录后查看会话历史</div>';
            document.getElementById('loginOverlay').style.display = 'flex';
            clearConversation();
        }

        function handleUnauthorized() {
            token = ''; username = '';
            localStorage.removeItem('ai_token');
            localStorage.removeItem('ai_username');
            currentConvId = 0;
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('convList').innerHTML =
                '<div style="text-align:center;color:#555;font-size:12px;padding:20px;">登录后查看会话历史</div>';
            document.getElementById('loginErr').style.color = '#ef4444';
            document.getElementById('loginErr').textContent = '登录已过期，请重新登录';
            document.getElementById('loginOverlay').style.display = 'flex';
        }

        // ===== 会话管理 =====
        async function loadConversations() {
            if (!token) return;
            try {
                const resp = await fetch(API_BASE + '/conversation/list', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({})
                });
                const data = await resp.json();
                if (data.code === 0) renderConvList(data.conversations);
            } catch (e) { }
        }

        function renderConvList(list) {
            const el = document.getElementById('convList');
            if (!list || list.length === 0) {
                el.innerHTML = '<div style="text-align:center;color:#555;font-size:12px;padding:20px;">暂无会话</div>';
                return;
            }
            el.innerHTML = list.map(c => `
        <div class="conv-item ${c.id === currentConvId ? 'active' : ''}"
             onclick="switchConversation(${c.id}, '${escHtml(c.title)}', '${c.mode}')">
            <div class="conv-item-title">${escHtml(c.title)}</div>
            <div class="conv-item-time">${c.updated_at}</div>
            <span class="conv-item-mode ${c.mode}">${c.mode === 'rag_chat' ? '🔍 知识库' : '💬 对话'}</span>
        </div>
    `).join('');
        }

        function escHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        async function switchConversation(id, title, convMode) {
            currentConvId = id;
            updateConvHint();
            // 切换模式
            if (convMode === 'rag_chat') setMode('rag');
            else setMode('stream');
            // 加载历史消息
            clearChat();
            try {
                const resp = await fetch(API_BASE + '/message/list', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ conversation_id: id, limit: 50 })
                });
                const data = await resp.json();
                if (data.code === 0 && data.messages) {
                    data.messages.forEach(m => addMessage(m.role === 'user' ? 'user' : 'assistant', m.content));
                }
            } catch (e) { }
            loadConversations();
        }

        function newConversation() {
            currentConvId = 0;
            updateConvHint();
            clearChat();
        }

        function clearConversation() {
            currentConvId = 0;
            updateConvHint();
            clearChat();
            loadConversations();
        }

        function clearChat() {
            const chatInner = document.getElementById('chatInner');
            chatInner.innerHTML = `
        <div class="welcome" id="welcome">
            <div class="welcome-icon">✨</div>
            <h2>你好，我是 AI 助手</h2>
            <p>登录后支持多轮对话记忆 · 知识库增强问答</p>
            <div class="quick-actions">
                <button class="quick-btn" onclick="quickSend('用一句话解释什么是多态')">💡 解释多态</button>
                <button class="quick-btn" onclick="quickSend('C++ 智能指针有哪几种？')">📚 智能指针</button>
                <button class="quick-btn" onclick="quickSend('什么是主从 Reactor 模型？')">🔧 Reactor 模型</button>
                <button class="quick-btn" onclick="quickSend('写一个快速排序的 C++ 代码')">💻 快速排序</button>
            </div>
        </div>`;
        }

        function updateConvHint() {
            const hint = document.getElementById('convHint');
            const disp = document.getElementById('convIdDisplay');
            if (currentConvId && token) {
                hint.style.display = 'block';
                disp.textContent = '#' + currentConvId;
            } else {
                hint.style.display = 'none';
            }
        }

        // ===== 模式切换 =====
        function setMode(m) {
            if (isGenerating) return;
            mode = m;
            document.getElementById('btnStream').className = 'mode-btn' + (m === 'stream' ? ' active' : '');
            document.getElementById('btnRag').className = 'mode-btn' + (m === 'rag' ? ' active' : '');
        }

        // ===== 发送 =====
        function quickSend(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
        }

        const textarea = document.getElementById('userInput');
        textarea.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 110) + 'px';
        });

        function scrollToBottom() {
            const c = document.getElementById('chatContainer');
            c.scrollTop = c.scrollHeight;
        }

        function addMessage(role, content, isRag) {
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.style.display = 'none';
            const chatInner = document.getElementById('chatInner');
            const div = document.createElement('div');
            div.className = 'message ' + role;
            const emoji = role === 'user' ? '🧑' : '🤖';
            const badge = (isRag && role === 'assistant') ? '<div class="rag-badge">🔍 知识库</div>' : '';
            div.innerHTML = `<div class="avatar">${emoji}</div><div class="bubble">${badge}${escapeHtml(content)}</div>`;
            chatInner.appendChild(div);
            scrollToBottom();
            return div;
        }

        function addLoadingMessage(isRag) {
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.style.display = 'none';
            const chatInner = document.getElementById('chatInner');
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'loadingMsg';
            const badge = isRag ? '<div class="rag-badge">🔍 知识库检索中...</div>' : '';
            div.innerHTML = `<div class="avatar">🤖</div><div class="bubble">${badge}<div class="loading-dots"><span></span><span></span><span></span></div></div>`;
            chatInner.appendChild(div);
            scrollToBottom();
            return div;
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const query = input.value.trim();
            if (!query || isGenerating) return;

            isGenerating = true;
            document.getElementById('sendBtn').disabled = true;
            addMessage('user', query);
            input.value = '';
            input.style.height = 'auto';

            if (mode === 'rag') await sendRag(query);
            else await sendStream(query);

            isGenerating = false;
            document.getElementById('sendBtn').disabled = false;
            input.focus();
        }

        // ===== 流式 SSE =====
        async function sendStream(query) {
            const loadingDiv = addLoadingMessage(false);
            try {
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = 'Bearer ' + token;
                const body = { query };
                if (token && currentConvId) body.conversation_id = currentConvId;

                const resp = await fetch(API_BASE + '/stream_chat', {
                    method: 'POST', headers, body: JSON.stringify(body)
                });
                if (resp.status === 401) { loadingDiv.remove(); handleUnauthorized(); return; }
                if (!resp.ok) { loadingDiv.remove(); addMessage('assistant', '❌ HTTP ' + resp.status); return; }
                loadingDiv.remove();
                await consumeSSE(resp, false);
            } catch (e) {
                loadingDiv.remove();
                addMessage('assistant', '❌ ' + e.message);
                updateStatus(false);
            }
        }

        // ===== RAG 流式 =====
        async function sendRag(query) {
            const loadingDiv = addLoadingMessage(true);
            try {
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = 'Bearer ' + token;
                const body = { query };
                if (token && currentConvId) body.conversation_id = currentConvId;

                const resp = await fetch(API_BASE + '/rag/stream_chat', {
                    method: 'POST', headers, body: JSON.stringify(body)
                });
                if (resp.status === 401) { loadingDiv.remove(); handleUnauthorized(); return; }
                if (!resp.ok) { loadingDiv.remove(); addMessage('assistant', '❌ HTTP ' + resp.status, true); return; } loadingDiv.remove();
                await consumeSSE(resp, true);
            } catch (e) {
                loadingDiv.remove();
                addMessage('assistant', '❌ ' + e.message, true);
                updateStatus(false);
            }
        }

        // ===== 消费 SSE 流 =====
        async function consumeSSE(resp, isRag) {
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.style.display = 'none';

            const chatInner = document.getElementById('chatInner');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant';
            const badge = isRag ? '<div class="rag-badge">🔍 知识库回答</div>' : '';
            msgDiv.innerHTML = `<div class="avatar">🤖</div><div class="bubble">${badge}<span class="stream-text"></span><span class="typing-cursor"></span></div>`;
            chatInner.appendChild(msgDiv);

            const textSpan = msgDiv.querySelector('.stream-text');
            const cursor = msgDiv.querySelector('.typing-cursor');
            let fullText = '';

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed || trimmed.startsWith(':')) continue;
                    if (!trimmed.startsWith('data: ')) continue;

                    const data = trimmed.substring(6);

                    if (data === '[DONE]') {
                        cursor.remove();
                        scrollToBottom();
                        loadConversations();
                        return;
                    }

                    if (data.startsWith('[ERROR]')) {
                        fullText += '\n❌ ' + data.substring(7);
                        textSpan.textContent = fullText;
                        cursor.remove();
                        scrollToBottom();
                        return;
                    }

                    // 提取 conversation_id（格式：[CONV:4]）
                    if (data.startsWith('[CONV:')) {
                        const convId = parseInt(data.slice(6, -1));
                        if (!isNaN(convId) && convId > 0) {
                            currentConvId = convId;
                            updateConvHint();
                            loadConversations();
                        }
                        continue; // 不显示到气泡里
                    }

                    fullText += data;
                    textSpan.textContent = fullText;
                    scrollToBottom();
                }
            }
            cursor.remove();
        }

        // ===== 状态检测 =====
        function updateStatus(ok) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.style.background = ok ? '#4ade80' : '#ef4444';
            dot.style.boxShadow = ok ? '0 0 6px #4ade80' : '0 0 6px #ef4444';
            text.textContent = ok ? '已连接' : '连接断开';
        }

        function checkStatus() {
            fetch(API_BASE + '/healthz')
                .then(r => updateStatus(r.ok))
                .catch(() => updateStatus(false));
        }
    </script>
</body>

</html>
